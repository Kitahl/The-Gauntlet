name: Bug report
description: Report a reproducible defect in software, validation, documentation, or public behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release, tag, or commit SHA.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened? Include exact errors/output where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened, and what specification/source defines that expectation?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Minimal commands, inputs, environment, and state needed to reproduce.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact / claim affected
      description: What workflow, result, or research claim could this defect affect?
  - type: dropdown
    id: security
    attributes:
      label: Security-sensitive?
      options: ["No", "Possibly — no exploit details included"]
    validations:
      required: true
