name: Apply Apparatus brand payload

on:
  push:
    branches:
      - work/elenchion-apparatus-brand
    paths:
      - scripts/.apply_elenchion_bundle.py
      - .github/workflows/apply-elenchion-brand.yml

permissions:
  contents: write

concurrency:
  group: apply-elenchion-apparatus-brand
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/elenchion-apparatus-brand
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Apply digest-bound payload
        run: python scripts/.apply_elenchion_bundle.py

      - name: Static syntax and rights gates
        run: |
          node --check docs/system-field.js
          python -m json.tool docs/brand/brand-system.json >/dev/null
          python -m json.tool docs/brand/asset-manifest.json >/dev/null
          python -m json.tool docs/content-provenance.json >/dev/null
          python -m json.tool docs/visuals/visual-provenance.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for name in ('docs/visuals/apparatus-frontispiece.svg', 'docs/visuals/elenchion-mark.svg'):
              ET.parse(name)
          items=json.loads(Path('docs/brand/asset-manifest.json').read_text())
          assert len(items)==3
          for item in items:
              assert item['commercial_use_allowed'] is True
              assert item['review_status']=='APPROVED_PROJECT_ORIGINAL'
              assert item['source_page_url'].startswith('https://')
              assert item['source_file_sha256']
          PY
          git diff --check

      - name: Install exact validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m playwright install --with-deps chromium

      - name: Run showcase validation in clean copy
        run: |
          rm -rf /tmp/apparatus-showcase-check
          mkdir -p /tmp/apparatus-showcase-check
          rsync -a --exclude .git ./ /tmp/apparatus-showcase-check/
          cd /tmp/apparatus-showcase-check
          python validation/validate_showcase.py

      - name: Commit reviewed product files
        env:
          BRANCH: work/elenchion-apparatus-brand
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test ! -e scripts/.apply_elenchion_bundle.py
          test ! -e .github/workflows/apply-elenchion-brand.yml
          git status --short
          git commit -m "brand: apply Elenchion Apparatus classical-scientific system"
          git push origin "HEAD:${BRANCH}"
