name: Runtime portability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Run runtime regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile runtime sources
        run: python -m compileall -q tools tests

  portability-gate:
    name: Runtime portability gate
    if: ${{ always() }}
    needs: [runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Require all portability jobs to pass
        env:
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          if [ "$RUNTIME_RESULT" != "success" ]; then
            echo "Runtime portability matrix result: $RUNTIME_RESULT" >&2
            exit 1
          fi
          echo "Runtime portability matrix passed on Linux, Windows, and macOS."
