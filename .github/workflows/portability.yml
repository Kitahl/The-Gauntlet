name: Runtime portability

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'skills/**'
      - '.claude/**'
      - '.gauntlet.json'
      - 'requirements-runtime.txt'
      - '.github/workflows/portability.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'skills/**'
      - '.claude/**'
      - '.gauntlet.json'
      - 'requirements-runtime.txt'
      - '.github/workflows/portability.yml'

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-runtime.txt
      - name: Run runtime regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile runtime sources
        run: python -m compileall -q tools tests
