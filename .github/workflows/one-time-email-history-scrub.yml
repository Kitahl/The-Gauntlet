name: One-time commit email privacy scrub

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-email-history-scrub.yml'

permissions:
  contents: write

jobs:
  scrub:
    if: github.repository == 'Kitahl/The-Gauntlet' && github.actor == 'Kitahl'
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite personal email from all branch and tag history
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_EMAIL: 666purplezombie666@gmail.com
          NEW_EMAIL: 222771578+Kitahl@users.noreply.github.com
        run: |
          set -euo pipefail
          export FILTER_BRANCH_SQUELCH_WARNING=1

          git clone --bare "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git
          git config user.name Kitahl
          git config user.email "${NEW_EMAIL}"

          git filter-branch --force \
            --env-filter '
              if [ "$GIT_AUTHOR_EMAIL" = "$OLD_EMAIL" ]; then
                export GIT_AUTHOR_EMAIL="$NEW_EMAIL"
              fi
              if [ "$GIT_COMMITTER_EMAIL" = "$OLD_EMAIL" ]; then
                export GIT_COMMITTER_EMAIL="$NEW_EMAIL"
              fi
            ' \
            --tag-name-filter cat \
            -- --all

          git for-each-ref --format='delete %(refname)' refs/original | git update-ref --stdin || true
          git reflog expire --expire=now --all

          if git log --all --format='%ae%n%ce' | grep -Fq "${OLD_EMAIL}"; then
            echo 'Old email remains in reachable commit metadata; refusing to push.' >&2
            exit 1
          fi

          if git for-each-ref refs/tags --format='%(taggeremail)' | grep -Fq "${OLD_EMAIL}"; then
            echo 'Old email remains in annotated tag metadata; refusing to push.' >&2
            exit 1
          fi

          git worktree add ../work main
          cd ../work
          git config user.name Kitahl
          git config user.email "${NEW_EMAIL}"
          git rm .github/workflows/one-time-email-history-scrub.yml
          git commit -m 'Remove one-time email history scrub workflow'

          cd ../repo.git
          if git log --all --format='%ae%n%ce' | grep -Fq "${OLD_EMAIL}"; then
            echo 'Old email reappeared after cleanup commit; refusing to push.' >&2
            exit 1
          fi

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin 'refs/heads/*:refs/heads/*'
          git push --force --tags origin
