name: FOIL benchmark pilot

on:
  pull_request:
    branches:
      - main
    paths:
      - 'benchmarks/**'
      - 'benchmark_runs/**'
      - '.github/workflows/foil-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-score:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare blinded HLE and ARC questions; score committed predictions
        run: python benchmarks/harness/hle_arc_prepare_score.py
      - name: Prepare blinded GPQA-Diamond questions; score committed predictions
        run: python benchmarks/harness/gpqa_prepare_score.py
      - name: Prepare blinded legacy BrowseComp questions; score committed predictions when present
        run: python benchmarks/harness/browsecomp_prepare_score.py
      - name: Prepare blinded four-way BrowseComp questions; score committed predictions when present
        run: python benchmarks/harness/browsecomp_four_way_prepare_score.py
      - name: Prepare fresh paired BrowseComp-40 questions; score only a complete isolated matrix
        run: python benchmarks/harness/browsecomp_paired40_prepare_score.py
      - name: Validate prospective ten-benchmark diversity suite
        run: python benchmarks/harness/diverse_suite_validate.py

      - name: Upload blinded HLE and ARC questions
        uses: actions/upload-artifact@v4
        with:
          name: foil-benchmark-questions
          path: benchmark_runs/2026-08-22/benchmark_questions.json
          if-no-files-found: error
      - name: Upload blinded GPQA-Diamond questions
        uses: actions/upload-artifact@v4
        with:
          name: foil-gpqa-questions
          path: benchmark_runs/2026-08-22/gpqa_questions.json
          if-no-files-found: error
      - name: Upload blinded legacy BrowseComp questions
        uses: actions/upload-artifact@v4
        with:
          name: foil-browsecomp-questions
          path: benchmark_runs/2026-08-22/browsecomp_questions.json
          if-no-files-found: error
      - name: Upload blinded four-way BrowseComp questions
        uses: actions/upload-artifact@v4
        with:
          name: foil-browsecomp-four-way-questions
          path: benchmark_runs/2026-08-22/browsecomp_four_way_questions.json
          if-no-files-found: error

      # Intentionally do not upload browsecomp_paired40_questions.json. The
      # selection seed and source are reproducible, while keeping the generated
      # question text out of public CI artifacts avoids creating a new leakage
      # surface for the prospective paired test.
      - name: Upload prospective diversity plan (no benchmark question text)
        uses: actions/upload-artifact@v4
        with:
          name: foil-diverse-suite-plan
          path: benchmark_runs/2026-08-22/diverse_suite_plan.json
          if-no-files-found: error

      - name: Upload HLE and ARC score receipt
        if: ${{ hashFiles('benchmark_runs/2026-08-22/benchmark_results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: foil-benchmark-results
          path: benchmark_runs/2026-08-22/benchmark_results.json
          if-no-files-found: error
      - name: Upload GPQA-Diamond score receipt
        if: ${{ hashFiles('benchmark_runs/2026-08-22/gpqa_results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: foil-gpqa-results
          path: benchmark_runs/2026-08-22/gpqa_results.json
          if-no-files-found: error
      - name: Upload legacy BrowseComp public score receipt
        if: ${{ hashFiles('benchmark_runs/2026-08-22/browsecomp_results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: foil-browsecomp-results
          path: benchmark_runs/2026-08-22/browsecomp_results.json
          if-no-files-found: error
      - name: Upload four-way BrowseComp public score receipt
        if: ${{ hashFiles('benchmark_runs/2026-08-22/browsecomp_four_way_results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: foil-browsecomp-four-way-results
          path: benchmark_runs/2026-08-22/browsecomp_four_way_results.json
          if-no-files-found: error
      - name: Upload paired BrowseComp-40 score receipt only after complete isolated execution
        if: ${{ hashFiles('benchmark_runs/2026-08-22/browsecomp_paired40_results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: foil-browsecomp-paired40-results
          path: benchmark_runs/2026-08-22/browsecomp_paired40_results.json
          if-no-files-found: error
