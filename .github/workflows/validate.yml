name: Research software validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-runtime.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-runtime.txt
          python -m playwright install --with-deps chromium
      - name: Lint public Python
        run: ruff check validation tools tests benchmarks/harness
      - name: Run runtime and layout tests
        run: python -m unittest discover -s tests -v
      - name: Validate Research Orchestrator and Process Assurance
        run: python validation/validate_soul_gauntlet_public.py
      - name: Validate public showcase
        run: python validation/validate_showcase.py
      - name: Check Python syntax
        run: python -m compileall -q validation tools tests benchmarks/harness
      - name: Check repository research metadata
        run: |
          test -f LICENSE
          test -f CITATION.cff
          test -f RESEARCH.md
          test -f REPRODUCIBILITY.md
          test -f CHANGELOG.md
          test -f SECURITY.md
          test -f docs/RUNTIME_SETUP.md
          test -f docs/BENCHMARKS.md
          test -f benchmarks/FRONTIER_EXAM_FOIL.md
          test -f benchmarks/results/2026-08-22-blinded-pilot.json
          test -f research/FOIL_PERSONALIZATION_BASIS.md
          test -f .claude/settings.json
          test -f .gauntlet.json
