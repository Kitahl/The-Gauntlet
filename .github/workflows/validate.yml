name: Research software validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m playwright install --with-deps chromium
      - name: Lint public Python
        run: ruff check validation tools tests benchmarks/harness
      - name: Run runtime and layout tests
        run: python -m unittest discover -s tests -v
      - name: Validate Research Orchestrator and Process Assurance
        run: python validation/validate_soul_gauntlet_public.py
      - name: Validate public showcase
        run: python validation/validate_showcase.py
      - name: Check Python syntax
        run: python -m compileall -q validation tools tests benchmarks/harness
      - name: Check repository research metadata
        run: |
          test -f LICENSE
          test -f CITATION.cff
          test -f RESEARCH.md
          test -f REPRODUCIBILITY.md
          test -f CHANGELOG.md
          test -f SECURITY.md
          test -f docs/RUNTIME_SETUP.md
          test -f docs/BENCHMARKS.md
          test -f benchmarks/FRONTIER_EXAM_FOIL.md
          test -f benchmarks/results/2026-08-22-blinded-pilot.json
          test -f research/FOIL_PERSONALIZATION_BASIS.md
          test -f requirements-lock.in
          test -f requirements-lock.txt
          test -f .claude/settings.json
          test -f .gauntlet.json
