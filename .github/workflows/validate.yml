name: Research software validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m playwright install --with-deps chromium
      - name: Lint public Python
        run: ruff check validation tools tests benchmarks/harness
      - name: Run focused automatic Soul tests
        run: python -m unittest tests/test_soul_planner.py -v
      - name: Run full suite fail-fast diagnostics
        run: python -m unittest discover -s tests -v -f
