name: Fastpath checkpoint qualification

on:
  push:
    branches:
      - work/native-hermes-fastpath
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-p7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify pinned Hermes gitlink
        run: |
          set -euo pipefail
          python scripts/vendor_hermes.py --verify-only
      - name: Install pinned Hermes runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e vendor/hermes-agent
      - name: Verify FAST-P7 advisory FOIL routing
        run: |
          set -euo pipefail
          python .github/phase7_verify.py
