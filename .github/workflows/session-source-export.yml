name: Session source export

on:
  push:
    branches:
      - upgrade/challenge-vnext-soul

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact source tree
        run: git archive --format=zip --output=session-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: session-source-${{ github.sha }}
          path: session-source.zip
          if-no-files-found: error
          retention-days: 1
