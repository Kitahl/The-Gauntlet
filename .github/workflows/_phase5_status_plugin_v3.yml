name: Phase 5 status plugin verification v3

on:
  push:
    branches:
      - work/native-hermes-fastpath
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-status-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify pinned Hermes gitlink
        run: |
          set -euo pipefail
          python scripts/vendor_hermes.py --verify-only
      - name: Install pinned Hermes runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e vendor/hermes-agent
      - name: Verify one agent-visible read-only status call
        run: |
          set -euo pipefail
          python .github/phase5_verify.py
