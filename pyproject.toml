[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-gauntlet"
version = "0.5.1"
description = "Evidence-governed research toolkit and isolated FAST-P8 alpha runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gauntlet = "gauntlet_host.cli:main"

[tool.setuptools]
packages = ["gauntlet_host"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
