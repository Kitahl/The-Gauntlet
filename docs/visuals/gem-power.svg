<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">Power engineering verification workflow</title>
  <desc id="desc">Source moves through build, test, runtime, regression, and receipt, with a separate failure-class path.</desc>
  <style>
    .bg{fill:#06090d}.route path{fill:none;stroke:#58cedc;stroke-width:1.6}.block rect{fill:#0a0f16;stroke:#657182;stroke-width:1.2}.block .pass{fill:#0a1712;stroke:#71cb8d;stroke-width:1.4}.block .warn{fill:#180d0d;stroke:#e26655;stroke-width:1.4}.label text{fill:#c5cdd7;font:700 10px Consolas,Menlo,monospace;letter-spacing:.7px;text-anchor:middle}
  </style>
  <rect class="bg" width="760" height="340"/>
  <g class="route"><path d="M116 152H158M254 152H296M392 152H434M530 152H572M668 152H720"/><path d="M482 180V252H626V180"/></g>
  <g class="block"><rect x="30" y="124" width="86" height="56"/><rect x="158" y="124" width="96" height="56"/><rect x="296" y="124" width="96" height="56"/><rect x="434" y="124" width="96" height="56"/><rect x="572" y="124" width="96" height="56"/><rect x="690" y="124" width="40" height="56" class="pass"/><rect x="526" y="230" width="100" height="44" class="warn"/></g>
  <g class="label"><text x="73" y="157">SOURCE</text><text x="206" y="157">BUILD</text><text x="344" y="157">TEST</text><text x="482" y="157">RUNTIME</text><text x="620" y="157">REGRESS</text><text x="710" y="150">R</text><text x="710" y="166">X</text><text x="576" y="257">FAILURE CLASS</text></g>
</svg>
