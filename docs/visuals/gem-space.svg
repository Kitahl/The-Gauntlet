<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">Space research discovery workflow</title>
  <desc id="desc">A mechanism query expands into papers, repositories, standards, and current sources before returning a scoped finding.</desc>
  <style>
    .bg{fill:#06090d}.route path{fill:none;stroke:#80aef7;stroke-width:1.6}.block rect{fill:#0a0f16;stroke:#657182;stroke-width:1.2}.block .core{fill:#0b1421;stroke:#80aef7;stroke-width:1.5}.block .pass{fill:#0a1712;stroke:#71cb8d;stroke-width:1.4}.label text{fill:#c5cdd7;font:700 10px Consolas,Menlo,monospace;letter-spacing:.7px;text-anchor:middle}.label .muted{fill:#8c98a8}
  </style>
  <rect class="bg" width="760" height="340"/>
  <g class="route"><path d="M140 170H228V72H364"/><path d="M140 170H364"/><path d="M140 170H228V268H364"/><path d="M466 72H536V170H636"/><path d="M466 170H636"/><path d="M466 268H536V170"/></g>
  <g class="block"><rect x="34" y="136" width="106" height="68" class="core"/><rect x="364" y="44" width="102" height="56"/><rect x="364" y="142" width="102" height="56"/><rect x="364" y="240" width="102" height="56"/><rect x="636" y="136" width="92" height="68" class="pass"/></g>
  <g class="label"><text x="87" y="165">MECHANISM</text><text x="87" y="182" class="muted">QUERY</text><text x="415" y="68">PAPERS</text><text x="415" y="84" class="muted">+ CITATIONS</text><text x="415" y="166">REPOS</text><text x="415" y="182" class="muted">+ DOCS</text><text x="415" y="264">STANDARDS</text><text x="415" y="280" class="muted">+ CURRENT</text><text x="682" y="164">SCOPED</text><text x="682" y="181">FINDING</text></g>
</svg>
