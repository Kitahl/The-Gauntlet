<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">Mind formal reasoning workflow</title>
  <desc id="desc">Objects, assumptions, and edge cases converge on a proof obligation with proof and counterexample branches.</desc>
  <style>
    .bg{fill:#06090d}.route path{fill:none;stroke:#dec167;stroke-width:1.6}.block rect{fill:#0a0f16;stroke:#657182;stroke-width:1.2}.block .core{fill:#15140d;stroke:#dec167;stroke-width:1.5}.block .pass{fill:#0a1712;stroke:#71cb8d;stroke-width:1.4}.block .warn{fill:#180d0d;stroke:#e26655;stroke-width:1.4}.label text{fill:#c5cdd7;font:700 10px Consolas,Menlo,monospace;letter-spacing:.7px;text-anchor:middle}.label .muted{fill:#8c98a8}
  </style>
  <rect class="bg" width="760" height="340"/>
  <g class="route"><path d="M128 86H250V170H338"/><path d="M128 170H338"/><path d="M128 254H250V170"/><path d="M454 170H528V104H638"/><path d="M454 170H528V236H638"/></g>
  <g class="block"><rect x="32" y="58" width="96" height="56"/><rect x="32" y="142" width="96" height="56"/><rect x="32" y="226" width="96" height="56"/><rect x="338" y="136" width="116" height="68" class="core"/><rect x="638" y="76" width="90" height="56" class="pass"/><rect x="638" y="208" width="90" height="56" class="warn"/></g>
  <g class="label"><text x="80" y="82">OBJECTS</text><text x="80" y="98" class="muted">+ DOMAINS</text><text x="80" y="166">ASSUMPTIONS</text><text x="80" y="182" class="muted">+ NEGATION</text><text x="80" y="250">EDGE CASES</text><text x="80" y="266" class="muted">+ SCOPE</text><text x="396" y="164">PROOF</text><text x="396" y="181">OBLIGATION</text><text x="683" y="100">PROOF</text><text x="683" y="116">PATH</text><text x="683" y="232">COUNTER-</text><text x="683" y="248">EXAMPLE</text></g>
</svg>
