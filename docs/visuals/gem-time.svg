<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">Time evaluation workflow</title>
  <desc id="desc">Candidate and baseline are evaluated across matched cells and converge on a stop or go decision.</desc>
  <style>
    .bg{fill:#06090d}.route path{fill:none;stroke:#84cb96;stroke-width:1.6}.block rect{fill:#0a0f16;stroke:#657182;stroke-width:1.2}.block .core{fill:#0d1810;stroke:#84cb96;stroke-width:1.5}.block .pass{fill:#0a1712;stroke:#71cb8d;stroke-width:1.4}.label text{fill:#c5cdd7;font:700 10px Consolas,Menlo,monospace;letter-spacing:.7px;text-anchor:middle}
  </style>
  <rect class="bg" width="760" height="340"/>
  <g class="route"><path d="M126 112H580"/><path d="M126 226H580"/><path d="M656 112H674V169"/><path d="M656 226H674V169"/></g>
  <g class="block"><rect x="30" y="84" width="96" height="56"/><rect x="30" y="198" width="96" height="56"/><rect x="176" y="84" width="76" height="56"/><rect x="302" y="84" width="76" height="56"/><rect x="428" y="84" width="76" height="56"/><rect x="176" y="198" width="76" height="56"/><rect x="302" y="198" width="76" height="56"/><rect x="428" y="198" width="76" height="56"/><rect x="580" y="84" width="76" height="56" class="pass"/><rect x="580" y="198" width="76" height="56"/><rect x="674" y="135" width="56" height="68" class="core"/></g>
  <g class="label"><text x="78" y="117">CANDIDATE</text><text x="78" y="231">BASELINE</text><text x="214" y="117">CELL 1</text><text x="340" y="117">CELL 2</text><text x="466" y="117">CELL 3</text><text x="214" y="231">CELL 1</text><text x="340" y="231">CELL 2</text><text x="466" y="231">CELL 3</text><text x="618" y="117">RESULT</text><text x="618" y="231">RESULT</text><text x="702" y="163">STOP</text><text x="702" y="180">/ GO</text></g>
</svg>
