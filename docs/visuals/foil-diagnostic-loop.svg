<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Mirror adaptive complement process</title>
  <desc id="desc">Task evidence produces competing gap hypotheses, one minimum discriminator, a smallest useful complement, claim-matched verification, changed-context transfer, and a bounded evidence update.</desc>
  <defs>
    <style>
      .bg{fill:#05080c}.rule{fill:none;stroke:#26313e;stroke-width:1}.route{fill:none;stroke:#ff735f;stroke-width:1.7}.box{fill:#090e14;stroke:#4a5869;stroke-width:1}.core{fill:#111820;stroke:#ff735f;stroke-width:1.3}.good{fill:#0a1712;stroke:#71cb8d;stroke-width:1.2}.txt{fill:#e0e6ec}.dim{fill:#758294}.accent{fill:#ff735f}.mono{font-family:Consolas,Menlo,monospace}.tiny{font-size:11px;letter-spacing:1px}.small{font-size:12px;letter-spacing:.8px}.label{font-size:14px;font-weight:700;letter-spacing:.7px}
    </style>
  </defs>
  <rect width="1200" height="470" class="bg"/>
  <path d="M40 88H1160" class="rule"/>
  <text x="40" y="52" class="mono accent tiny">MIRROR / TASK EVIDENCE → COMPLEMENT → TRANSFER</text>
  <text x="1160" y="52" text-anchor="end" class="mono dim tiny">ASSISTANCE AND OWNERSHIP STAY SEPARATE</text>

  <rect x="48" y="248" width="150" height="96" class="box"/>
  <text x="123" y="280" text-anchor="middle" class="mono dim tiny">OBSERVED STATE</text>
  <text x="123" y="310" text-anchor="middle" class="mono txt label">TASK EVIDENCE</text>
  <text x="123" y="332" text-anchor="middle" class="mono dim tiny">+ CONTEXT</text>
  <path d="M198 296H252" class="route"/>

  <rect x="252" y="170" width="182" height="60" class="box"/><rect x="252" y="266" width="182" height="60" class="box"/><rect x="252" y="362" width="182" height="60" class="box"/>
  <text x="343" y="196" text-anchor="middle" class="mono dim tiny">HYPOTHESIS 01</text><text x="343" y="217" text-anchor="middle" class="mono txt small">KNOWLEDGE GAP</text>
  <text x="343" y="292" text-anchor="middle" class="mono dim tiny">HYPOTHESIS 02</text><text x="343" y="313" text-anchor="middle" class="mono txt small">REPRESENTATION</text>
  <text x="343" y="388" text-anchor="middle" class="mono dim tiny">HYPOTHESIS 03</text><text x="343" y="409" text-anchor="middle" class="mono txt small">TOOL / VERIFIER</text>
  <path d="M434 200H476V296M434 296H476M434 392H476V296" class="route"/>

  <rect x="476" y="248" width="178" height="96" class="core"/>
  <text x="565" y="280" text-anchor="middle" class="mono accent tiny">MINIMUM CHECK</text>
  <text x="565" y="310" text-anchor="middle" class="mono txt label">WHICH GAP</text>
  <text x="565" y="332" text-anchor="middle" class="mono txt label">MATTERS?</text>
  <path d="M654 296H712" class="route"/>

  <rect x="712" y="204" width="176" height="70" class="box"/><rect x="712" y="318" width="176" height="70" class="good"/>
  <text x="800" y="232" text-anchor="middle" class="mono dim tiny">COMPLEMENT</text><text x="800" y="254" text-anchor="middle" class="mono txt small">MINIMUM ASSISTANCE</text>
  <text x="800" y="346" text-anchor="middle" class="mono dim tiny">CHECK</text><text x="800" y="368" text-anchor="middle" class="mono txt small">CLAIM-MATCHED VERIFY</text>
  <path d="M888 239H930V296M888 353H930V296" class="route"/>

  <rect x="930" y="204" width="222" height="70" class="box"/><rect x="930" y="318" width="222" height="70" class="box"/>
  <text x="1041" y="232" text-anchor="middle" class="mono dim tiny">TRANSFER</text><text x="1041" y="254" text-anchor="middle" class="mono txt small">CHANGED CONTEXT</text>
  <text x="1041" y="346" text-anchor="middle" class="mono dim tiny">STATE</text><text x="1041" y="368" text-anchor="middle" class="mono txt small">EVIDENCE UPDATE</text>
  <path d="M1041 274V318" class="route"/>
</svg>
