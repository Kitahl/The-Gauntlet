<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Selective research routing trace</title>
  <desc id="desc">One research goal is decomposed into three obligations. Each obligation is routed to one specialist tool, produces one evidence receipt, and the receipts converge on a scoped release.</desc>
  <defs>
    <style>
      .bg{fill:#05080c}.rule{fill:none;stroke:#26313e;stroke-width:1}.route{fill:none;stroke:#ff735f;stroke-width:2}.box{fill:#090e14;stroke:#4a5869;stroke-width:1.2}.goal{fill:#0d131b;stroke:#cbd3dc;stroke-width:1.3}.tool{fill:#0d131b;stroke-width:1.5}.space{stroke:#8ab4f8}.power{stroke:#66d7e4}.council{stroke:#e58bd4}.receipt{fill:#111820;stroke:#ff735f;stroke-width:1.3}.release{fill:#17110f;stroke:#ff735f;stroke-width:1.8}.txt{fill:#e4e8ed}.dim{fill:#788596}.accent{fill:#ff735f}.mono{font-family:Consolas,Menlo,monospace}.tiny{font-size:16px;letter-spacing:1.5px}.small{font-size:18px;letter-spacing:1.7px}.label{font-size:23px;font-weight:700;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1600" height="700" class="bg"/>
  <path d="M72 104H1528" class="rule"/>
  <text x="72" y="66" class="mono accent small">SELECTIVE ROUTING / TRACE 001</text>
  <text x="1528" y="66" text-anchor="end" class="mono dim tiny">ONE GOAL · THREE OBLIGATIONS · THREE RECEIPTS</text>

  <rect x="78" y="350" width="250" height="120" class="goal"/>
  <text x="108" y="385" class="mono dim tiny">GOAL</text>
  <text x="108" y="425" class="mono txt label">VERIFY A NEW</text>
  <text x="108" y="456" class="mono txt label">RESEARCH METHOD</text>

  <path d="M328 410H408V222H484M408 410H484M408 410V598H484" class="route"/>

  <rect x="484" y="180" width="236" height="84" class="box"/>
  <rect x="484" y="368" width="236" height="84" class="box"/>
  <rect x="484" y="556" width="236" height="84" class="box"/>
  <text x="510" y="211" class="mono dim tiny">OBLIGATION 01</text><text x="510" y="244" class="mono txt label">PRIOR ART</text>
  <text x="510" y="399" class="mono dim tiny">OBLIGATION 02</text><text x="510" y="432" class="mono txt label">EXECUTABLE CLAIM</text>
  <text x="510" y="587" class="mono dim tiny">OBLIGATION 03</text><text x="510" y="620" class="mono txt label">INDEPENDENT REVIEW</text>

  <path d="M720 222H812M720 410H812M720 598H812" class="route"/>
  <rect x="812" y="180" width="170" height="84" class="tool space"/>
  <rect x="812" y="368" width="170" height="84" class="tool power"/>
  <rect x="812" y="556" width="170" height="84" class="tool council"/>
  <text x="897" y="211" text-anchor="middle" class="mono dim tiny">SELECTED TOOL</text><text x="897" y="244" text-anchor="middle" class="mono txt label">SPACE</text>
  <text x="897" y="399" text-anchor="middle" class="mono dim tiny">SELECTED TOOL</text><text x="897" y="432" text-anchor="middle" class="mono txt label">POWER</text>
  <text x="897" y="587" text-anchor="middle" class="mono dim tiny">SELECTED TOOL</text><text x="897" y="620" text-anchor="middle" class="mono txt label">COUNCIL</text>

  <path d="M982 222H1060M982 410H1060M982 598H1060" class="route"/>
  <rect x="1060" y="180" width="190" height="84" class="receipt"/>
  <rect x="1060" y="368" width="190" height="84" class="receipt"/>
  <rect x="1060" y="556" width="190" height="84" class="receipt"/>
  <text x="1086" y="211" class="mono dim tiny">RECEIPT 01</text><text x="1086" y="244" class="mono txt small">SEARCH SCOPE</text>
  <text x="1086" y="399" class="mono dim tiny">RECEIPT 02</text><text x="1086" y="432" class="mono txt small">EXECUTION</text>
  <text x="1086" y="587" class="mono dim tiny">RECEIPT 03</text><text x="1086" y="620" class="mono txt small">REVIEW</text>

  <path d="M1250 222H1320V410H1372M1250 410H1372M1250 598H1320V410" class="route"/>
  <rect x="1372" y="350" width="156" height="120" class="release"/>
  <text x="1450" y="385" text-anchor="middle" class="mono accent tiny">RELEASE</text>
  <text x="1450" y="425" text-anchor="middle" class="mono txt label">SCOPED</text>
  <text x="1450" y="456" text-anchor="middle" class="mono txt label">RESULT</text>

</svg>
