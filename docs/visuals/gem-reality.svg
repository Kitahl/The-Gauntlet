<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">Reality method synthesis workflow</title>
  <desc id="desc">Known methods establish a named gap, candidate mechanisms branch from the gap, and candidates return through a prior-art recheck.</desc>
  <style>
    .bg{fill:#06090d}.route path{fill:none;stroke:#df86cf;stroke-width:1.6}.block rect{fill:#0a0f16;stroke:#657182;stroke-width:1.2}.block .core{fill:#1a0f19;stroke:#df86cf;stroke-width:1.5}.block .pass{fill:#0a1712;stroke:#71cb8d;stroke-width:1.4}.label text{fill:#c5cdd7;font:700 10px Consolas,Menlo,monospace;letter-spacing:.7px;text-anchor:middle}.label .muted{fill:#8c98a8}
  </style>
  <rect class="bg" width="760" height="340"/>
  <g class="route"><path d="M142 170H244"/><path d="M354 170H420V104H522"/><path d="M354 170H420V236H522"/><path d="M622 104H656V170H728"/><path d="M622 236H656V170"/></g>
  <g class="block"><rect x="30" y="136" width="112" height="68"/><rect x="244" y="136" width="110" height="68" class="core"/><rect x="522" y="76" width="100" height="56"/><rect x="522" y="208" width="100" height="56"/><rect x="668" y="136" width="60" height="68" class="pass"/></g>
  <g class="label"><text x="86" y="164">KNOWN</text><text x="86" y="181" class="muted">METHODS</text><text x="299" y="164">NAMED</text><text x="299" y="181">GAP</text><text x="572" y="100">CANDIDATE</text><text x="572" y="116" class="muted">A</text><text x="572" y="232">CANDIDATE</text><text x="572" y="248" class="muted">B</text><text x="698" y="164">RE-</text><text x="698" y="181">CHECK</text></g>
</svg>
