<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Gauntlet system map</title>
  <desc id="desc">A five-stage system map. A framed goal becomes three explicit obligations. Each is routed to a selected specialist, produces a receipt, and converges on a scoped verdict.</desc>
  <defs>
    <style>
      .bg{fill:#05080c}.rule{fill:none;stroke:#26313e;stroke-width:1}.route{fill:none;stroke:#ff735f;stroke-width:1.7}.box{fill:#090e14;stroke:#4b5869;stroke-width:1}.frame{fill:#0d131b;stroke:#cbd3dc;stroke-width:1.2}.space{fill:#0d131b;stroke:#8ab4f8;stroke-width:1.3}.power{fill:#0d131b;stroke:#66d7e4;stroke-width:1.3}.time{fill:#0d131b;stroke:#8ed19d;stroke-width:1.3}.receipt{fill:#111820;stroke:#ff735f;stroke-width:1.2}.release{fill:#17110f;stroke:#ff735f;stroke-width:1.5}.txt{fill:#e1e6ec}.dim{fill:#748193}.accent{fill:#ff735f}.mono{font-family:Consolas,Menlo,monospace}.tiny{font-size:11px;letter-spacing:1px}.small{font-size:12px;letter-spacing:.8px}.label{font-size:14px;font-weight:700;letter-spacing:.7px}
    </style>
  </defs>
  <rect width="1200" height="500" class="bg"/>
  <path d="M40 88H1160" class="rule"/>
  <text x="40" y="52" class="mono accent tiny">SYSTEM MAP / CLAIM-NATIVE ROUTING</text>
  <text x="1160" y="52" text-anchor="end" class="mono dim tiny">SPEC → STATE → ACTION / TOOL → RECEIPT → VERDICT</text>

  <text x="58" y="126" class="mono dim tiny">01 / FRAME</text>
  <rect x="58" y="266" width="136" height="96" class="frame"/>
  <text x="126" y="298" text-anchor="middle" class="mono txt label">GOAL</text><text x="126" y="323" text-anchor="middle" class="mono dim tiny">SCOPE</text><text x="126" y="344" text-anchor="middle" class="mono dim tiny">SUCCESS</text>
  <path d="M194 314H244" class="route"/>

  <text x="244" y="126" class="mono dim tiny">02 / OBLIGATE</text>
  <rect x="244" y="180" width="170" height="64" class="box"/><rect x="244" y="282" width="170" height="64" class="box"/><rect x="244" y="384" width="170" height="64" class="box"/>
  <text x="329" y="217" text-anchor="middle" class="mono txt small">WHAT EXISTS?</text><text x="329" y="319" text-anchor="middle" class="mono txt small">DOES IT RUN?</text><text x="329" y="421" text-anchor="middle" class="mono txt small">HOW STRONG?</text>

  <path d="M414 212H484M414 314H484M414 416H484" class="route"/>
  <text x="484" y="126" class="mono dim tiny">03 / SELECT TOOL</text>
  <rect x="484" y="180" width="156" height="64" class="space"/><rect x="484" y="282" width="156" height="64" class="power"/><rect x="484" y="384" width="156" height="64" class="time"/>
  <text x="562" y="204" text-anchor="middle" class="mono dim tiny">PRIOR ART</text><text x="562" y="227" text-anchor="middle" class="mono txt label">SPACE</text>
  <text x="562" y="306" text-anchor="middle" class="mono dim tiny">EXECUTABLE</text><text x="562" y="329" text-anchor="middle" class="mono txt label">POWER</text>
  <text x="562" y="408" text-anchor="middle" class="mono dim tiny">EVALUATION</text><text x="562" y="431" text-anchor="middle" class="mono txt label">TIME</text>

  <path d="M640 212H710M640 314H710M640 416H710" class="route"/>
  <text x="710" y="126" class="mono dim tiny">04 / RECEIPT</text>
  <rect x="710" y="180" width="164" height="64" class="receipt"/><rect x="710" y="282" width="164" height="64" class="receipt"/><rect x="710" y="384" width="164" height="64" class="receipt"/>
  <text x="792" y="217" text-anchor="middle" class="mono txt small">SEARCH SCOPE</text><text x="792" y="319" text-anchor="middle" class="mono txt small">EXECUTION</text><text x="792" y="421" text-anchor="middle" class="mono txt small">EVALUATION</text>

  <path d="M874 212H936V314H990M874 314H990M874 416H936V314" class="route"/>
  <text x="990" y="126" class="mono dim tiny">05 / RELEASE</text>
  <rect x="990" y="260" width="150" height="108" class="release"/>
  <text x="1065" y="294" text-anchor="middle" class="mono accent tiny">VERDICT</text><text x="1065" y="324" text-anchor="middle" class="mono txt label">SCOPED</text><text x="1065" y="347" text-anchor="middle" class="mono txt label">RESULT</text>

</svg>
