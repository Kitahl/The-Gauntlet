<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Selective research routing field</title>
  <desc id="desc">A research goal is decomposed into explicit obligations. Those obligations connect selectively to Mind, Space, Reality, Power, and Time specialist nodes. Typed evidence receipts then converge into a scoped release. There is no literal gauntlet illustration.</desc>
  <defs>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .bg{fill:#06090e}.grid{fill:none;stroke:#131b25;stroke-width:1}.edge{fill:none;stroke:#536276;stroke-width:1.2}.edgeHot{fill:none;stroke:#ff7a66;stroke-width:1.8;stroke-dasharray:4 8}.node{fill:#0d141d;stroke:#718095;stroke-width:1.2}.goal{fill:#eef2f5;stroke:#fff}.ob{fill:#111923;stroke:#8290a2}.mind{fill:#e4c66f}.space{fill:#8ab4f8}.reality{fill:#e58bd4}.power{fill:#66d7e4}.time{fill:#8ed19d}.receipt{fill:#ff7a66;stroke:#fff0ed}.pass{fill:#8ed19d;stroke:#effff3}.muted{fill:#7d8999}.txt{fill:#edf1f5}.accent{fill:#ff7a66}.mono{font-family:Consolas,Menlo,monospace}.sans{font-family:Arial,Helvetica,sans-serif}.tiny{font-size:10px;letter-spacing:1.2px}.small{font-size:12px;letter-spacing:.5px}.label{font-size:15px;font-weight:700}.big{font-size:23px;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="720" class="bg"/>
  <g opacity=".6"><path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200M0 630H1200M150 0V720M300 0V720M450 0V720M600 0V720M750 0V720M900 0V720M1050 0V720" class="grid"/></g>
  <text x="48" y="54" class="mono accent tiny">THE GAUNTLET / SELECTIVE ROUTING FIELD</text><text x="1152" y="54" text-anchor="end" class="mono muted tiny">OBLIGATIONS FIRST · METHODS SECOND</text>

  <g><rect x="54" y="274" width="180" height="116" rx="8" class="node"/><text x="78" y="306" class="mono accent tiny">RESEARCH GOAL</text><text x="78" y="342" class="sans txt big">Is the method</text><text x="78" y="371" class="sans txt big">new, runnable, better?</text></g>

  <g class="mono tiny"><text x="304" y="130" class="muted">OBLIGATIONS</text></g>
  <g><circle cx="350" cy="190" r="22" class="ob"/><circle cx="350" cy="290" r="22" class="ob"/><circle cx="350" cy="390" r="22" class="ob"/><circle cx="350" cy="490" r="22" class="ob"/><text x="388" y="194" class="sans txt small">Prior art?</text><text x="388" y="294" class="sans txt small">Named gap?</text><text x="388" y="394" class="sans txt small">Executable?</text><text x="388" y="494" class="sans txt small">Better under matched test?</text></g>
  <path d="M234 332C286 320 292 194 328 190M234 332C286 330 292 291 328 290M234 332C286 342 292 388 328 390M234 332C286 356 292 486 328 490" class="edge"/>

  <g><text x="594" y="130" class="mono muted tiny">SPECIALIST ROUTES</text>
    <circle cx="650" cy="190" r="26" class="mind" filter="url(#g)"/><circle cx="770" cy="190" r="26" class="space" filter="url(#g)"/><circle cx="890" cy="290" r="26" class="reality" filter="url(#g)"/><circle cx="770" cy="390" r="26" class="power" filter="url(#g)"/><circle cx="650" cy="490" r="26" class="time" filter="url(#g)"/>
    <text x="650" y="238" text-anchor="middle" class="mono txt tiny">MIND</text><text x="770" y="238" text-anchor="middle" class="mono txt tiny">SPACE</text><text x="890" y="338" text-anchor="middle" class="mono txt tiny">REALITY</text><text x="770" y="438" text-anchor="middle" class="mono txt tiny">POWER</text><text x="650" y="538" text-anchor="middle" class="mono txt tiny">TIME</text>
  </g>
  <path d="M372 190C470 190 540 190 624 190" class="edge" opacity=".28"/><path d="M372 190C470 190 584 190 744 190" class="edgeHot"/>
  <path d="M372 290C500 290 634 290 864 290" class="edgeHot"/>
  <path d="M372 390C510 390 620 390 744 390" class="edgeHot"/>
  <path d="M372 490C470 490 550 490 624 490" class="edgeHot"/>
  <text x="598" y="174" class="mono muted tiny">STANDBY</text>

  <g><text x="975" y="130" class="mono muted tiny">EVIDENCE</text><circle cx="1010" cy="215" r="18" class="receipt"/><circle cx="1010" cy="315" r="18" class="receipt"/><circle cx="1010" cy="415" r="18" class="receipt"/><circle cx="1010" cy="515" r="18" class="receipt"/><text x="1042" y="219" class="sans txt small">source receipt</text><text x="1042" y="319" class="sans txt small">gap / synthesis receipt</text><text x="1042" y="419" class="sans txt small">execution receipt</text><text x="1042" y="519" class="sans txt small">evaluation receipt</text></g>
  <path d="M796 190C900 190 930 214 992 215M916 290C955 290 970 304 992 315M796 390C900 390 930 414 992 415M676 490C830 490 920 514 992 515" class="edgeHot"/>

  <g><rect x="860" y="596" width="286" height="78" rx="8" class="node"/><circle cx="891" cy="635" r="12" class="pass"/><text x="918" y="630" class="mono accent tiny">SCOPED RELEASE</text><text x="918" y="653" class="sans txt label">Evidence supports only the stated claim.</text></g>
  <path d="M1010 533C1010 565 982 580 930 596" class="edgeHot"/>
  <text x="50" y="676" class="mono muted tiny">NODES = EXPLICIT OBLIGATIONS · ROUTES = SELECTIVE SPECIALIST METHODS · RECEIPTS = INSPECTABLE EVIDENCE</text><text x="1150" y="676" text-anchor="end" class="mono accent tiny">AGREEMENT ≠ VERIFICATION</text>
</svg>
