<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Exploratory benchmark evidence visual</title>
  <desc id="desc">Three paired horizontal bar comparisons: HLE base 16.7 percent and assisted 33.3 percent; ARC-AGI-1 base 66.7 percent and assisted 83.3 percent; GPQA-Diamond base and assisted both 75 percent. The figure emphasizes that the GPQA follow-up was a null result and that all pilots are exploratory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101419"/><stop offset="1" stop-color="#080a0d"/></linearGradient>
    <style>.t{font-family:Inter,Arial,sans-serif;fill:#f5f7f9}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.muted{fill:#8e99a5}.grid{stroke:#28313a;stroke-width:1}.base{fill:#59636f}.assist{fill:#77f2c4}.null{fill:#aeb7c0}.card{fill:#0d1116;stroke:#303a45}</style>
  </defs>
  <rect width="1200" height="620" rx="26" fill="url(#bg)"/>
  <text x="54" y="56" class="m" font-size="12" fill="#ff8a3d" letter-spacing="2">EXPLORATORY MODEL BENCHMARKS</text>
  <text x="54" y="96" class="t" font-size="28" font-weight="800">Positive and null results stay on the same surface.</text>
  <text x="54" y="125" class="muted" font-family="Inter,Arial" font-size="12">Small deterministic disjoint-subset pilots. Not official leaderboard submissions or general-efficacy evidence.</text>

  <g transform="translate(310 165)"><path class="grid" d="M0 0v330M170 0v330M340 0v330M510 0v330M680 0v330"/><text x="0" y="-14" class="m muted" font-size="10">0%</text><text x="160" y="-14" class="m muted" font-size="10">25%</text><text x="330" y="-14" class="m muted" font-size="10">50%</text><text x="500" y="-14" class="m muted" font-size="10">75%</text><text x="668" y="-14" class="m muted" font-size="10">100%</text></g>

  <g transform="translate(54 178)"><text x="0" y="24" class="t" font-size="18" font-weight="700">HLE public text</text><text x="0" y="47" class="m muted" font-size="10">n=6 PER CONDITION</text><text x="0" y="86" class="m muted" font-size="10">BASE</text><rect x="256" y="70" width="114" height="22" rx="6" class="base"/><text x="380" y="86" class="m muted" font-size="11">16.7%</text><text x="0" y="122" class="m" font-size="10" fill="#77f2c4">ASSISTED</text><rect x="256" y="106" width="227" height="22" rx="6" class="assist"/><text x="493" y="122" class="m" font-size="11" fill="#77f2c4">33.3% · +16.7 pp</text></g>

  <g transform="translate(54 322)"><text x="0" y="24" class="t" font-size="18" font-weight="700">ARC-AGI-1</text><text x="0" y="47" class="m muted" font-size="10">n=6 PER CONDITION</text><text x="0" y="86" class="m muted" font-size="10">BASE</text><rect x="256" y="70" width="454" height="22" rx="6" class="base"/><text x="720" y="86" class="m muted" font-size="11">66.7%</text><text x="0" y="122" class="m" font-size="10" fill="#77f2c4">ASSISTED</text><rect x="256" y="106" width="567" height="22" rx="6" class="assist"/><text x="833" y="122" class="m" font-size="11" fill="#77f2c4">83.3% · +16.7 pp</text></g>

  <g transform="translate(54 466)"><text x="0" y="24" class="t" font-size="18" font-weight="700">GPQA-Diamond</text><text x="0" y="47" class="m muted" font-size="10">n=12 PER CONDITION</text><text x="0" y="86" class="m muted" font-size="10">BASE</text><rect x="256" y="70" width="510" height="22" rx="6" class="base"/><text x="776" y="86" class="m muted" font-size="11">75.0%</text><text x="0" y="122" class="m" font-size="10" fill="#c9d0d7">ASSISTED</text><rect x="256" y="106" width="510" height="22" rx="6" class="null"/><text x="776" y="122" class="m" font-size="11" fill="#c9d0d7">75.0% · NULL</text></g>

  <g transform="translate(936 170)"><rect class="card" width="212" height="298" rx="18"/><text x="20" y="34" class="m" font-size="10" fill="#ff8a3d">READ THIS FIGURE AS</text><text x="20" y="72" class="t" font-size="16" font-weight="700">Scoped evidence</text><text x="20" y="98" class="muted" font-family="Inter,Arial" font-size="11">not a product score</text><path d="M20 120h172" class="grid"/><text x="20" y="151" class="t" font-size="15" font-weight="700">Null preserved</text><text x="20" y="177" class="muted" font-family="Inter,Arial" font-size="11">GPQA does not move</text><path d="M20 199h172" class="grid"/><text x="20" y="230" class="t" font-size="15" font-weight="700">No significance claim</text><text x="20" y="256" class="muted" font-family="Inter,Arial" font-size="11">sample sizes are small</text><text x="20" y="276" class="muted" font-family="Inter,Arial" font-size="11">and exploratory</text></g>
</svg>
